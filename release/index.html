  <body class="bg-zinc-100 dark:bg-[#09090b]">
    <div id="root">
      <div
        id="kh-brand-splash"
        style="position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#09090b;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;transition:background 0.15s ease;"

          style="position:absolute;width:340px;height:340px;border-radius:9999px;background:radial-gradient(circle, rgba(225,29,72,0.18) 0%, rgba(225,29,72,0) 70%);filter:blur(24px);pointer-events:none;animation:khPulseGlow 2.4s ease-in-out infinite;"
        ></div>

        <div
          id="kh-favicon-shell"
          style="position:relative;z-index:1;width:84px;height:84px;border-radius:24px;padding:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);box-shadow:0 20px 50px -12px rgba(0,0,0,0.55), 0 0 0 1px rgba(225,29,72,0.22);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);"
        >
          <img
            id="kh-splash-favicon"
            src="/api/favicon.php"
            alt="Logo"
            style="width:100%;height:100%;border-radius:18px;object-fit:cover;display:block;background:#18181b;"
          />
        </div>

        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;">
          <div
            id="kh-splash-title"
            style="font-size:15px;font-weight:800;letter-spacing:-0.02em;color:#f4f4f5;"
          >
            Pizza Khalessi
          </div>

          <div
            id="kh-splash-track"
            style="width:148px;height:3px;border-radius:9999px;background:rgba(255,255,255,0.1);overflow:hidden;position:relative;"
          >
            <div
              id="kh-splash-bar"
              style="position:absolute;inset-y:0;top:0;bottom:0;width:46%;border-radius:9999px;background:linear-gradient(90deg, transparent, #e11d48, transparent);animation:khSweep 1.25s cubic-bezier(0.4,0,0.2,1) infinite;"
            ></div>
          </div>

          <div
            id="kh-splash-sub"
            style="font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#71717a;"
          >
            Cargando experiencia...
          </div>
        </div>
      </div>
      <style>@keyframes khSweep{0%{transform:translate(-110%)}to{transform:translate(240%)}}@keyframes khPulseGlow{0%,to{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}</style>
      <script>
        (function () {
          try {
            var icon = localStorage.getItem('kh_brand_favicon_v1') || '';
            var primary = localStorage.getItem('kh_brand_primary_v1') || '';
            var theme = localStorage.getItem('kh_brand_theme_v1') || '';
            var brandName = '';
            if (!icon || !primary || !brandName) {
              var raw = localStorage.getItem('khalessi_erp_settings_v3');
              if (raw) {
                var parsed = JSON.parse(raw);
                var c = parsed && parsed.customization ? parsed.customization : null;
                if (c) {
                  icon = icon || c.favicon || c.storeHeaderLogo || c.logoDark || c.logoLight || '';
                  primary = primary || c.primaryColor || '';
                  theme = theme || c.themePreference || '';
                }
                if (parsed && parsed.companyInfo && parsed.companyInfo.commercialName) {
                  brandName = parsed.companyInfo.commercialName;
                }
              }
            }
            var path = window.location.pathname || '/';
            var hash = window.location.hash || '';
            var isAdmin = path.startsWith('/admin') || hash.startsWith('#admin');
            var isKiosk = path.startsWith('/kiosco') || hash.startsWith('#kiosco');
            var isStorefront = !isAdmin && !isKiosk;

            var storeThemeMode = '';
            if (isStorefront) {
              var rawBuilder = localStorage.getItem('kh_store_builder_v2');
              if (rawBuilder) {
                var parsedBuilder = JSON.parse(rawBuilder);
                if (parsedBuilder && Array.isArray(parsedBuilder.templates) && parsedBuilder.templates.length > 0) {
                  var activeId = parsedBuilder.activeTemplateId || parsedBuilder.templates[0].id;
                  var activeTpl = parsedBuilder.templates[0];
                  for (var i = 0; i < parsedBuilder.templates.length; i++) {
                    if (parsedBuilder.templates[i] && parsedBuilder.templates[i].id === activeId) {
                      activeTpl = parsedBuilder.templates[i];
                      break;
                    }
                  }
                  if (activeTpl && (activeTpl.themeMode === 'light' || activeTpl.themeMode === 'dark')) {
                    storeThemeMode = activeTpl.themeMode;
                  }
                }
              }
            }

            var useLight = false;
            if (isStorefront) {
              useLight = storeThemeMode ? storeThemeMode === 'light' : false;
            } else if (isKiosk) {
              useLight = false;
            } else {
              if (theme === 'light') useLight = true;
              else if (theme === 'dark') useLight = false;
              else useLight = !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }

            document.documentElement.classList.toggle('dark', !useLight);
            var surfaceBg = useLight ? (isStorefront ? '#f8fafc' : '#f4f4f5') : (isStorefront ? '#0b0c10' : '#09090b');
            document.body.style.backgroundColor = surfaceBg;

            var splash = document.getElementById('kh-brand-splash');
            var shell = document.getElementById('kh-favicon-shell');
            var glow = document.getElementById('kh-splash-glow');
            var bar = document.getElementById('kh-splash-bar');
            var track = document.getElementById('kh-splash-track');
            var titleEl = document.getElementById('kh-splash-title');
            var subEl = document.getElementById('kh-splash-sub');
            var img = document.getElementById('kh-splash-favicon');

            if (titleEl && brandName) titleEl.textContent = brandName;
            if (subEl) {
              subEl.textContent = isAdmin
                ? 'Iniciando Panel ERP...'
                : isKiosk
                ? 'Preparando Autoservicio...'
                : 'Preparando la carta...';
            }

            if (splash) {
              splash.style.background = surfaceBg;
              if (useLight) {
                if (shell) {
                  shell.style.background = '#ffffff';
                  shell.style.border = '1px solid rgba(15,23,42,0.08)';
                  shell.style.boxShadow = '0 20px 45px -12px rgba(15,23,42,0.14), 0 0 0 1px rgba(15,23,42,0.04)';
                }
                if (img) img.style.background = '#ffffff';
                if (titleEl) titleEl.style.color = '#09090b';
                if (track) track.style.background = 'rgba(15,23,42,0.08)';
                if (subEl) subEl.style.color = '#64748b';
              }
            }

            var accent = primary && /^#[0-9a-fA-F]{6}$/.test(primary) ? primary : '#e11d48';
            if (shell && !useLight) {
              shell.style.boxShadow = '0 20px 50px -12px rgba(0,0,0,0.55), 0 0 0 1px ' + accent + '38';
            }
            if (glow) {
              glow.style.background = 'radial-gradient(circle, ' + accent + '30 0%, rgba(0,0,0,0) 70%)';
            }
            if (bar) {
              bar.style.background = 'linear-gradient(90deg, transparent, ' + accent + ', transparent)';
            }

            if (icon && img) {
              img.src = icon;
              var headLink = document.querySelector("link[rel*='icon']");
              if (headLink) headLink.href = icon;
            }
          } catch (e) {}
        })();
      </script>
    </div>
