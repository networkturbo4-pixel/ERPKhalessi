  <body class="bg-zinc-100 dark:bg-[#09090b]">
    <div id="root">
      <div id="kh-brand-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;transition:background 0.15s ease;">
        <div id="kh-favicon-shell" style="position:relative;padding:7px;border-radius:26px;background:rgba(255,255,255,0.04);border:2px solid rgba(225,29,72,0.55);box-shadow:0 16px 38px -8px rgba(225,29,72,0.32),inset 0 0 0 1px rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;animation:khFloat 1.6s infinite ease-in-out;">
          <div id="kh-favicon-ring" style="position:absolute;inset:-6px;border-radius:31px;border:2px solid transparent;border-top-color:#e11d48;border-right-color:rgba(225,29,72,0.35);animation:khSpin 1.05s linear infinite;pointer-events:none;"></div>
          <img
            id="kh-splash-favicon"
            src="/api/favicon.php"
            alt="Logo"
            style="width:74px;height:74px;border-radius:19px;object-fit:cover;display:block;border:2px solid rgba(255,255,255,0.28);background:#18181b;"
          />
        </div>
      </div>
      <style>@keyframes khSpin{0%{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes khFloat{0%,to{transform:scale(1)}50%{transform:scale(1.035)}}</style>
      <script>
        (function () {
          try {
            var icon = localStorage.getItem('kh_brand_favicon_v1') || '';
            var primary = localStorage.getItem('kh_brand_primary_v1') || '';
            var theme = localStorage.getItem('kh_brand_theme_v1') || '';
            if (!icon || !primary) {
              var raw = localStorage.getItem('khalessi_erp_settings_v3');
              if (raw) {
                var parsed = JSON.parse(raw);
                var c = parsed && parsed.customization ? parsed.customization : null;
                if (c) {
                  icon = icon || c.favicon || c.storeHeaderLogo || c.logoDark || c.logoLight || '';
                  primary = primary || c.primaryColor || '';
                  theme = theme || c.themePreference || '';
                }
              }
            }
            var isStorefront = !window.location.pathname.startsWith('/admin') &&
              (localStorage.getItem('kh_active_main_module') || 'storefront') === 'storefront';
            var useLight = isStorefront ? theme !== 'dark' : theme === 'light';
            var splash = document.getElementById('kh-brand-splash');
            var shell = document.getElementById('kh-favicon-shell');
            var ring = document.getElementById('kh-favicon-ring');
            var img = document.getElementById('kh-splash-favicon');

            if (splash && useLight) {
              splash.style.background = '#f8fafc';
              if (shell) {
                shell.style.background = '#ffffff';
                shell.style.boxShadow = '0 18px 40px -10px rgba(15,23,42,0.16), inset 0 0 0 1px rgba(15,23,42,0.06)';
              }
              if (img) {
                img.style.border = '2px solid rgba(15,23,42,0.12)';
                img.style.background = '#ffffff';
              }
            }

            if (primary && /^#[0-9a-fA-F]{6}$/.test(primary)) {
              if (shell) shell.style.borderColor = primary + '88';
              if (ring) {
                ring.style.borderTopColor = primary;
                ring.style.borderRightColor = primary + '44';
              }
            }

            if (icon && img) {
              img.src = icon;
              var headLink = document.querySelector("link[rel*='icon']");
              if (headLink) headLink.href = icon;
            }
          } catch (e) {}
        })();
      </script>
    </div>
  </body>
