<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khalessi Pizza ERP | Plataforma Multisucursal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-100 dark:bg-[#09090b]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090b;font-family:system-ui,-apple-system,sans-serif;color:#ffffff;">
        <div style="width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#e11d48,#be123c);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 12px 28px -5px rgba(225,29,72,0.45);animation:khPulse 1.6s infinite ease-in-out;">
          🍕
        </div>
        <div style="margin-top:20px;font-weight:900;font-size:18px;letter-spacing:1.5px;color:#ffffff;">
          KHALESSI PIZZA ERP
        </div>
        <div style="margin-top:5px;font-size:11px;font-weight:700;letter-spacing:2px;color:#94a3b8;text-transform:uppercase;">
          Cargando Sistema...
        </div>
        <div style="margin-top:22px;width:150px;height:3.5px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#f43f5e,#fb7185);border-radius:99px;animation:khBar 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes khPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.06); opacity: 0.88; }
        }
        @keyframes khBar {
          0% { left: -50%; width: 35%; }
          50% { left: 35%; width: 50%; }
          100% { left: 110%; width: 35%; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
